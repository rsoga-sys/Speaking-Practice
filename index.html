<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検スピーキングチャレンジ - 語句整序ゲーム</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:'Segoe UI','Hiragino Sans','Meiryo',sans-serif;background:#f0f4ff;color:#333;min-height:100vh;overflow-x:hidden}

/* ===== Utility ===== */
.hidden{display:none!important}
.container{max-width:800px;margin:0 auto;padding:20px}

/* ===== Header ===== */
.app-header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;text-align:center;padding:20px 0;box-shadow:0 4px 15px rgba(102,126,234,.4)}
.app-header h1{font-size:1.6rem;font-weight:700;letter-spacing:.05em}
.app-header p{font-size:.85rem;opacity:.85;margin-top:4px}

/* ===== Screen: Course Select ===== */
#screen-select{text-align:center;padding-top:30px}
#screen-select h2{font-size:1.3rem;margin-bottom:24px;color:#4a5568}

.grade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:30px}
.grade-btn{padding:18px 10px;border:none;border-radius:14px;font-size:1.05rem;font-weight:700;color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.grade-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.grade-btn:active{transform:translateY(0)}
.grade-5{background:linear-gradient(135deg,#43e97b,#38f9d7)}
.grade-4{background:linear-gradient(135deg,#fa709a,#fee140)}
.grade-3{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}
.grade-pre2{background:linear-gradient(135deg,#fbc2eb,#a6c1ee)}
.grade-2{background:linear-gradient(135deg,#f6d365,#fda085)}

/* Level select */
#level-select{margin-top:10px}
#level-select h3{font-size:1.1rem;margin-bottom:16px;color:#4a5568}
.level-grid{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.level-btn{width:64px;height:64px;border:none;border-radius:50%;font-size:1.2rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 10px rgba(102,126,234,.4)}
.level-btn:hover{transform:scale(1.12);box-shadow:0 5px 18px rgba(102,126,234,.5)}
.back-btn{margin-top:20px;padding:10px 28px;border:2px solid #667eea;border-radius:10px;background:#fff;color:#667eea;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s}
.back-btn:hover{background:#667eea;color:#fff}

/* ===== Screen: Gameplay ===== */
#screen-game{padding-top:20px;text-align:center;position:relative}

.game-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:.9rem;color:#666}
.game-info .badge{background:#667eea;color:#fff;padding:4px 14px;border-radius:20px;font-weight:600}

/* Timer bar */
.timer-bar-wrap{width:100%;height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:20px}
.timer-bar{height:100%;background:linear-gradient(90deg,#43e97b,#38f9d7);border-radius:6px;transition:width .3s linear}
.timer-bar.warn{background:linear-gradient(90deg,#f6d365,#fda085)}
.timer-bar.danger{background:linear-gradient(90deg,#ff416c,#ff4b2b);animation:pulse-bar .5s infinite alternate}
@keyframes pulse-bar{0%{opacity:1}100%{opacity:.6}}

.timer-text{font-size:2rem;font-weight:700;margin-bottom:10px}
.timer-text.danger-text{color:#e53e3e;animation:shake .3s infinite alternate}
@keyframes shake{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}

/* Question area */
.question-jp{font-size:.95rem;color:#718096;margin-bottom:14px}
.word-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:24px;min-height:60px}
.word-tile{padding:10px 18px;background:#fff;border:2px solid #cbd5e0;border-radius:12px;font-size:1.1rem;font-weight:600;color:#2d3748;box-shadow:0 2px 6px rgba(0,0,0,.08);animation:pop-in .3s ease backwards}
@keyframes pop-in{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

/* Speech area */
.speech-area{margin-bottom:20px}
.mic-btn{width:80px;height:80px;border:none;border-radius:50%;font-size:2.2rem;cursor:pointer;transition:transform .15s,box-shadow .15s;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 15px rgba(102,126,234,.4)}
.mic-btn:hover{transform:scale(1.08)}
.mic-btn.recording{background:linear-gradient(135deg,#ff416c,#ff4b2b);animation:pulse-mic 1s infinite}
@keyframes pulse-mic{0%{box-shadow:0 0 0 0 rgba(255,65,108,.5)}70%{box-shadow:0 0 0 20px rgba(255,65,108,0)}100%{box-shadow:0 0 0 0 rgba(255,65,108,0)}}
.mic-label{display:block;margin-top:8px;font-size:.8rem;color:#888}

.recognized-text{min-height:40px;padding:10px 16px;background:#fff;border-radius:10px;font-size:1rem;color:#2d3748;border:2px solid #e2e8f0;margin-top:14px;transition:border-color .2s}
.recognized-text.correct{border-color:#48bb78;background:#f0fff4}
.recognized-text.wrong{border-color:#fc8181;background:#fff5f5}

/* Bomb overlay */
.bomb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100}
.bomb-character{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);text-align:center;animation:bomb-bounce 1s ease infinite}
@keyframes bomb-bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-20px)}}
.bomb-emoji{font-size:6rem;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.bomb-timer{font-size:2.5rem;font-weight:900;color:#e53e3e;text-shadow:0 2px 8px rgba(229,62,62,.5)}
.animal-char{font-size:4rem;position:absolute;bottom:25%;animation:run-around 3s ease infinite}
.animal-char.left{left:10%;animation-delay:0s}
.animal-char.right{right:10%;animation-delay:.5s}
@keyframes run-around{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-15px) scale(1.05)}50%{transform:translateY(0) scale(1)}75%{transform:translateY(-10px) scale(.95)}}

/* Explosion */
.explosion-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,50,50,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:flash-in .2s}
@keyframes flash-in{0%{opacity:0}100%{opacity:1}}
.explosion-text{font-size:5rem;animation:explode .5s ease}
@keyframes explode{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0deg)}}
.explosion-msg{color:#fff;font-size:1.5rem;font-weight:700;margin-top:16px}

/* ===== Screen: Result ===== */
#screen-result{padding-top:30px;text-align:center}
.result-icon{font-size:5rem;margin-bottom:10px}
.result-title{font-size:1.5rem;font-weight:700;margin-bottom:20px}
.result-title.correct-title{color:#38a169}
.result-title.wrong-title{color:#e53e3e}

.result-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:left;margin-bottom:20px}
.result-card h4{font-size:.85rem;color:#a0aec0;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.result-card .answer-en{font-size:1.2rem;font-weight:700;color:#2d3748;margin-bottom:12px}
.result-card .answer-jp{font-size:1rem;color:#718096;margin-bottom:16px}
.result-card .grammar-point{background:#f7fafc;border-left:4px solid #667eea;padding:12px 16px;border-radius:0 8px 8px 0;font-size:.9rem;line-height:1.6;color:#4a5568}

.listen-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s;margin-bottom:16px}
.listen-btn:hover{transform:scale(1.05)}

.nav-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.nav-btn{padding:12px 28px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s}
.nav-btn:hover{transform:translateY(-2px)}
.nav-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 12px rgba(102,126,234,.3)}
.nav-btn.secondary{background:#fff;color:#667eea;border:2px solid #667eea}

/* ===== Question counter / progress ===== */
.progress-wrap{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.progress-dots{display:flex;gap:6px}
.progress-dot{width:12px;height:12px;border-radius:50%;background:#e2e8f0;transition:background .2s}
.progress-dot.done-correct{background:#48bb78}
.progress-dot.done-wrong{background:#fc8181}
.progress-dot.current{background:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.3)}

/* Score summary */
.score-summary{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:20px}
.score-summary h3{font-size:1.2rem;margin-bottom:16px;color:#4a5568}
.score-big{font-size:3rem;font-weight:900;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.score-detail{margin-top:10px;font-size:.95rem;color:#718096}

/* ===== Responsive ===== */
@media(max-width:480px){
  .app-header h1{font-size:1.2rem}
  .word-tile{padding:8px 12px;font-size:.95rem}
  .mic-btn{width:68px;height:68px;font-size:1.8rem}
  .bomb-emoji{font-size:4rem}
  .bomb-timer{font-size:2rem}
  .timer-text{font-size:1.6rem}
}
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <h1>🎙️ 英検スピーキングチャレンジ</h1>
  <p>声に出して英文を完成させよう！</p>
</header>

<!-- Screen: Course Select -->
<div id="screen-select" class="container">
  <div id="grade-select">
    <h2>級を選んでね</h2>
    <div class="grade-grid">
      <button class="grade-btn grade-5" onclick="selectGrade('5')">英検5級</button>
      <button class="grade-btn grade-4" onclick="selectGrade('4')">英検4級</button>
      <button class="grade-btn grade-3" onclick="selectGrade('3')">英検3級</button>
      <button class="grade-btn grade-pre2" onclick="selectGrade('pre2')">英検準2級</button>
      <button class="grade-btn grade-2" onclick="selectGrade('2')">英検2級</button>
    </div>
  </div>
  <div id="level-select" class="hidden">
    <h3 id="level-title">レベルを選んでね</h3>
    <div class="level-grid">
      <button class="level-btn" onclick="selectLevel(1)">1</button>
      <button class="level-btn" onclick="selectLevel(2)">2</button>
      <button class="level-btn" onclick="selectLevel(3)">3</button>
      <button class="level-btn" onclick="selectLevel(4)">4</button>
      <button class="level-btn" onclick="selectLevel(5)">5</button>
    </div>
    <button class="back-btn" onclick="backToGrades()">← 級選択に戻る</button>
  </div>
</div>

<!-- Screen: Game -->
<div id="screen-game" class="container hidden">
  <div class="game-info">
    <span class="badge" id="game-badge">英検5級 Lv.1</span>
    <span id="q-counter">1 / 5</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-dots" id="progress-dots"></div>
  </div>
  <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar"></div></div>
  <div class="timer-text" id="timer-text">30</div>
  <p class="question-jp" id="question-jp">日本語訳がここに表示されます</p>
  <div class="word-tiles" id="word-tiles"></div>
  <div class="speech-area">
    <button class="mic-btn" id="mic-btn" onclick="toggleRecognition()">🎤</button>
    <span class="mic-label" id="mic-label">タップして話す</span>
    <div class="recognized-text" id="recognized-text">ここに認識結果が表示されます</div>
  </div>
  <!-- Bomb overlay (hidden until 10s) -->
  <div class="bomb-overlay hidden" id="bomb-overlay">
    <div class="animal-char left">🐱</div>
    <div class="animal-char right">🐶</div>
    <div class="bomb-character">
      <span class="bomb-emoji">💣</span>
      <span class="bomb-timer" id="bomb-timer">10</span>
    </div>
  </div>
</div>

<!-- Explosion overlay -->
<div class="explosion-overlay hidden" id="explosion-overlay">
  <div class="explosion-text">💥</div>
  <div class="explosion-msg">ドカーン！タイムアップ！</div>
</div>

<!-- Screen: Result (per-question) -->
<div id="screen-result" class="container hidden">
  <div class="result-icon" id="result-icon">⭕</div>
  <div class="result-title" id="result-title">正解！すごい！</div>
  <div class="result-card">
    <h4>正解の英文</h4>
    <div class="answer-en" id="result-en">I play tennis every day.</div>
    <h4>日本語訳</h4>
    <div class="answer-jp" id="result-jp">私は毎日テニスをします。</div>
    <h4>文法ポイント</h4>
    <div class="grammar-point" id="result-grammar">一般動詞の現在形の文です。</div>
  </div>
  <button class="listen-btn" onclick="speakAnswer()">🔊 音声を聴く</button>
  <div class="nav-btns">
    <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()">次の問題へ →</button>
    <button class="nav-btn secondary" onclick="goHome()">ホームに戻る</button>
  </div>
</div>

<!-- Screen: Final Score -->
<div id="screen-score" class="container hidden">
  <div class="result-icon">🏆</div>
  <div class="score-summary">
    <h3 id="score-grade-label">英検5級 Lv.1 結果</h3>
    <div class="score-big" id="score-big">0 / 5</div>
    <div class="score-detail" id="score-detail"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-dots" id="final-dots"></div>
  </div>
  <div class="nav-btns" style="margin-top:20px">
    <button class="nav-btn primary" onclick="retryLevel()">もう一度チャレンジ</button>
    <button class="nav-btn secondary" onclick="goHome()">ホームに戻る</button>
  </div>
</div>

<script>
// ============================================================
// Question Bank - 英検5級〜2級, Level 1〜5, 各5問
// ============================================================
const QUESTIONS = {
  "5": {
    name: "英検5級",
    levels: {
      1: [
        { en: "I like apples.", jp: "私はりんごが好きです。", grammar: "「I like ～.」は「私は～が好きです」という意味の基本文型です。like の後に好きなものを置きます。" },
        { en: "This is a pen.", jp: "これはペンです。", grammar: "「This is ～.」は「これは～です」という紹介の表現です。a は「1つの」を意味する冠詞です。" },
        { en: "I play tennis.", jp: "私はテニスをします。", grammar: "「I play ～.」で「私は～をします」というスポーツの表現です。play はスポーツや楽器に使います。" },
        { en: "She is my sister.", jp: "彼女は私の姉（妹）です。", grammar: "「She is ～.」は「彼女は～です」。my は「私の」という所有格です。" },
        { en: "I have a dog.", jp: "私は犬を飼っています。", grammar: "「I have ～.」は「私は～を持っています / 飼っています」。have は所有を表す基本動詞です。" }
      ],
      2: [
        { en: "He is a student.", jp: "彼は学生です。", grammar: "「He is ～.」は「彼は～です」。a student で「一人の学生」を表します。" },
        { en: "I go to school.", jp: "私は学校に行きます。", grammar: "「go to ～」は「～へ行く」。school の前に the はつけないのが一般的です。" },
        { en: "Do you like music?", jp: "あなたは音楽が好きですか？", grammar: "Do you ～? は一般動詞の疑問文です。Yes, I do. / No, I don't. で答えます。" },
        { en: "I can swim well.", jp: "私は上手に泳げます。", grammar: "can は「～できる」を表す助動詞です。well は「上手に」という副詞です。" },
        { en: "What is this?", jp: "これは何ですか？", grammar: "What is ～? は「～は何ですか？」という疑問文です。What は「何」を意味する疑問詞です。" }
      ],
      3: [
        { en: "I eat breakfast every day.", jp: "私は毎日朝食を食べます。", grammar: "every day は「毎日」。習慣を表す現在形と一緒に使います。" },
        { en: "My mother is kind.", jp: "私の母は優しいです。", grammar: "形容詞 kind（優しい）を be 動詞の後に置いて、人の性格を表現します。" },
        { en: "Where is the library?", jp: "図書館はどこですか？", grammar: "Where is ～? は場所をたずねる疑問文です。Where は「どこ」を意味します。" },
        { en: "How many books do you have?", jp: "あなたは本を何冊持っていますか？", grammar: "How many ～? は数をたずねる表現です。数えられる名詞の複数形と使います。" },
        { en: "I don't like winter.", jp: "私は冬が好きではありません。", grammar: "don't (do not) を動詞の前に置くと否定文になります。" }
      ],
      4: [
        { en: "There is a cat on the bed.", jp: "ベッドの上に猫がいます。", grammar: "There is ～. は「～があります / います」。場所を表す前置詞 on（～の上に）も重要です。" },
        { en: "I want to be a teacher.", jp: "私は先生になりたいです。", grammar: "want to be ～ は「～になりたい」。to be は be 動詞の原形です。" },
        { en: "She plays the piano very well.", jp: "彼女はとても上手にピアノを弾きます。", grammar: "三人称単数現在形で plays と s がつきます。the piano と楽器には the をつけます。" },
        { en: "When is your birthday?", jp: "あなたの誕生日はいつですか？", grammar: "When is ～? は時をたずねる疑問文です。When は「いつ」を意味します。" },
        { en: "I am reading a book now.", jp: "私は今本を読んでいます。", grammar: "am reading は現在進行形（be動詞 + ～ing）で「今～しているところ」を表します。" }
      ],
      5: [
        { en: "Whose bag is this?", jp: "これは誰のかばんですか？", grammar: "Whose ～? は「誰の～？」と持ち主をたずねる疑問文です。" },
        { en: "Let's go to the park.", jp: "公園に行きましょう。", grammar: "Let's ～. は「～しましょう」という勧誘の表現です。" },
        { en: "He can run very fast.", jp: "彼はとても速く走れます。", grammar: "can + 動詞の原形で「～できる」。fast は「速く」という副詞です。" },
        { en: "I usually get up at seven.", jp: "私はたいてい7時に起きます。", grammar: "usually は「たいてい」という頻度の副詞です。get up は「起きる」という句動詞です。" },
        { en: "Which color do you like?", jp: "あなたはどの色が好きですか？", grammar: "Which ～? は「どの～？」と選択をたずねる疑問詞です。" }
      ]
    }
  },
  "4": {
    name: "英検4級",
    levels: {
      1: [
        { en: "I was very tired yesterday.", jp: "私は昨日とても疲れていました。", grammar: "was は be 動詞の過去形です。yesterday（昨日）と一緒に過去の状態を表します。" },
        { en: "She went to the store.", jp: "彼女はお店に行きました。", grammar: "went は go の過去形（不規則変化）です。過去の動作を表します。" },
        { en: "I have been to Kyoto.", jp: "私は京都に行ったことがあります。", grammar: "have been to ～ は「～に行ったことがある」という経験を表す現在完了形です。" },
        { en: "It is raining outside.", jp: "外は雨が降っています。", grammar: "It is raining は天気を表す現在進行形です。天気の主語は it を使います。" },
        { en: "Please open the window.", jp: "窓を開けてください。", grammar: "Please + 動詞の原形 で丁寧な命令文（お願い）を作ります。" }
      ],
      2: [
        { en: "I will visit my grandmother tomorrow.", jp: "私は明日祖母を訪ねるつもりです。", grammar: "will + 動詞の原形で未来の予定・意志を表します。tomorrow は「明日」。" },
        { en: "She is taller than her brother.", jp: "彼女は兄（弟）より背が高いです。", grammar: "taller than ～ は比較級の表現です。形容詞に -er をつけて「～より…」を表します。" },
        { en: "I have to finish my homework.", jp: "私は宿題を終わらせなければなりません。", grammar: "have to + 動詞の原形で「～しなければならない」という義務を表します。" },
        { en: "What time does the bus come?", jp: "バスは何時に来ますか？", grammar: "What time ～? は「何時に～？」と時刻をたずねる表現です。" },
        { en: "I enjoyed playing soccer.", jp: "私はサッカーをして楽しみました。", grammar: "enjoy + ～ing で「～して楽しむ」。enjoy の後は動名詞を使います。" }

// ============================================================
// Game State
// ============================================================
let state = {
  grade: null,
  level: null,
  questions: [],
  currentQ: 0,
  totalQ: 5,
  score: 0,
  results: [],  // per-question results: {correct: bool}
  timer: null,
  timeLeft: 30,
  isRecording: false,
  recognition: null,
  answered: false
};

// ============================================================
// DOM Elements
// ============================================================
const $ = id => document.getElementById(id);
const screenSelect = $('screen-select');
const screenGame   = $('screen-game');
const screenResult = $('screen-result');
const screenScore  = $('screen-score');
const gradeSelect  = $('grade-select');
const levelSelect  = $('level-select');
const bombOverlay  = $('bomb-overlay');
const explosionOverlay = $('explosion-overlay');

// ============================================================
// Screen Management
// ============================================================
function showScreen(screen) {
  [screenSelect, screenGame, screenResult, screenScore].forEach(s => s.classList.add('hidden'));
  screen.classList.remove('hidden');
  explosionOverlay.classList.add('hidden');
  bombOverlay.classList.add('hidden');
}

// ============================================================
// Course Selection
// ============================================================
function selectGrade(grade) {
  state.grade = grade;
  gradeSelect.classList.add('hidden');
  levelSelect.classList.remove('hidden');
  $('level-title').textContent = QUESTIONS[grade].name + ' — レベルを選んでね';
}

function backToGrades() {
  gradeSelect.classList.remove('hidden');
  levelSelect.classList.add('hidden');
}

function selectLevel(level) {
  state.level = level;
  state.questions = [...QUESTIONS[state.grade].levels[level]];
  state.currentQ = 0;
  state.score = 0;
  state.results = [];
  $('game-badge').textContent = QUESTIONS[state.grade].name + ' Lv.' + level;
  showScreen(screenGame);
  buildProgressDots();
  startQuestion();
}

function goHome() {
  stopTimer();
  stopRecognition();
  showScreen(screenSelect);
  gradeSelect.classList.remove('hidden');
  levelSelect.classList.add('hidden');
}

function retryLevel() {
  selectLevel(state.level);
}

// ============================================================
// Progress Dots
// ============================================================
function buildProgressDots() {
  const wrap = $('progress-dots');
  wrap.innerHTML = '';
  for (let i = 0; i < state.questions.length; i++) {
    const dot = document.createElement('span');
    dot.className = 'progress-dot' + (i === 0 ? ' current' : '');
    wrap.appendChild(dot);
  }
}

function updateProgressDots() {
  const dots = $('progress-dots').children;
  for (let i = 0; i < dots.length; i++) {
    dots[i].className = 'progress-dot';
    if (i < state.results.length) {
      dots[i].className += state.results[i].correct ? ' done-correct' : ' done-wrong';
    } else if (i === state.currentQ) {
      dots[i].className += ' current';
    }
  }
}

// ============================================================
// Question Logic
// ============================================================
function startQuestion() {
  state.answered = false;
  state.timeLeft = 30;
  const q = state.questions[state.currentQ];

  $('q-counter').textContent = (state.currentQ + 1) + ' / ' + state.questions.length;
  $('question-jp').textContent = '💬 ' + q.jp;
  updateProgressDots();

  // Scramble words
  const words = q.en.replace(/[.!?,]/g, '').split(/\s+/);
  const shuffled = shuffleArray([...words]);
  const tiles = $('word-tiles');
  tiles.innerHTML = '';
  shuffled.forEach((w, i) => {
    const tile = document.createElement('span');
    tile.className = 'word-tile';
    tile.style.animationDelay = (i * 0.08) + 's';
    tile.textContent = w;
    tiles.appendChild(tile);
  });

  $('recognized-text').textContent = 'ここに認識結果が表示されます';
  $('recognized-text').className = 'recognized-text';
  $('mic-label').textContent = 'タップして話す';

  bombOverlay.classList.add('hidden');
  explosionOverlay.classList.add('hidden');

  updateTimerDisplay();
  startTimer();
}

function shuffleArray(arr) {
  // Fisher-Yates shuffle, but ensure it's not the same as original
  const original = arr.join(' ');
  let shuffled;
  let attempts = 0;
  do {
    shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    attempts++;
  } while (shuffled.join(' ') === original && attempts < 20);
  return shuffled;
}

// ============================================================
// Timer
// ============================================================
function startTimer() {
  stopTimer();
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();

    if (state.timeLeft <= 10 && state.timeLeft > 0) {
      bombOverlay.classList.remove('hidden');
      $('bomb-timer').textContent = state.timeLeft;
    }

    if (state.timeLeft <= 0) {
      timeUp();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timer) {
    clearInterval(state.timer);
    state.timer = null;
  }
}

function updateTimerDisplay() {
  const bar = $('timer-bar');
  const txt = $('timer-text');
  const pct = (state.timeLeft / 30) * 100;
  bar.style.width = pct + '%';

  bar.className = 'timer-bar';
  txt.className = 'timer-text';
  if (state.timeLeft <= 5) {
    bar.classList.add('danger');
    txt.classList.add('danger-text');
  } else if (state.timeLeft <= 10) {
    bar.classList.add('warn');
  }

  txt.textContent = state.timeLeft;
}

function timeUp() {
  stopTimer();
  stopRecognition();
  state.answered = true;

  // Show explosion
  explosionOverlay.classList.remove('hidden');
  bombOverlay.classList.add('hidden');

  state.results.push({ correct: false });

  setTimeout(() => {
    showResultScreen(false);
  }, 2000);
}

// ============================================================
// Speech Recognition (Web Speech API)
// ============================================================
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('このブラウザは音声認識に対応していません。Google Chrome をお使いください。');
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 3;

  rec.onresult = (event) => {
    let interim = '';
    let final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        final += event.results[i][0].transcript;
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    const text = final || interim;
    $('recognized-text').textContent = text || '...聞き取り中...';

    if (final && !state.answered) {
      checkAnswer(final);
    }
  };

  rec.onerror = (event) => {
    console.log('Speech error:', event.error);
    if (event.error === 'no-speech') {
      $('mic-label').textContent = '音声が検出されませんでした。もう一度タップ。';
    }
    state.isRecording = false;
    $('mic-btn').classList.remove('recording');
    $('mic-label').textContent = 'タップして話す';
  };

  rec.onend = () => {
    if (state.isRecording && !state.answered) {
      // Restart if user hasn't answered yet
      try { rec.start(); } catch(e) {}
    } else {
      state.isRecording = false;
      $('mic-btn').classList.remove('recording');
      $('mic-label').textContent = 'タップして話す';
    }
  };

  return rec;
}

function toggleRecognition() {
  if (state.answered) return;
  if (state.isRecording) {
    stopRecognition();
  } else {
    startRecognition();
  }
}

function startRecognition() {
  if (!state.recognition) {
    state.recognition = initRecognition();
  }
  if (!state.recognition) return;
  try {
    state.recognition.start();
    state.isRecording = true;
    $('mic-btn').classList.add('recording');
    $('mic-label').textContent = '🔴 聞き取り中...タップで停止';
  } catch(e) {
    console.log('Recognition start error:', e);
  }
}

function stopRecognition() {
  if (state.recognition) {
    state.isRecording = false;
    try { state.recognition.stop(); } catch(e) {}
    $('mic-btn').classList.remove('recording');
    $('mic-label').textContent = 'タップして話す';
  }
}

// ============================================================
// Answer Checking
// ============================================================
function normalizeText(text) {
  return text
    .toLowerCase()
    .replace(/['']/g, "'")
    .replace(/[.,!?;:"""]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function checkAnswer(spoken) {
  if (state.answered) return;
  const q = state.questions[state.currentQ];
  const expected = normalizeText(q.en);
  const got = normalizeText(spoken);

  // Also check against alternatives without contractions
  const expandContractions = t => t
    .replace(/don't/g, 'do not')
    .replace(/doesn't/g, 'does not')
    .replace(/didn't/g, 'did not')
    .replace(/can't/g, 'cannot')
    .replace(/won't/g, 'will not')
    .replace(/shouldn't/g, 'should not')
    .replace(/couldn't/g, 'could not')
    .replace(/wouldn't/g, 'would not')
    .replace(/isn't/g, 'is not')
    .replace(/aren't/g, 'are not')
    .replace(/wasn't/g, 'was not')
    .replace(/weren't/g, 'were not')
    .replace(/haven't/g, 'have not')
    .replace(/hasn't/g, 'has not')
    .replace(/hadn't/g, 'had not')
    .replace(/i'm/g, 'i am')
    .replace(/he's/g, 'he is')
    .replace(/she's/g, 'she is')
    .replace(/it's/g, 'it is')
    .replace(/we're/g, 'we are')
    .replace(/they're/g, 'they are')
    .replace(/you're/g, 'you are')
    .replace(/i've/g, 'i have')
    .replace(/we've/g, 'we have')
    .replace(/they've/g, 'they have')
    .replace(/i'll/g, 'i will')
    .replace(/he'll/g, 'he will')
    .replace(/she'll/g, 'she will')
    .replace(/we'll/g, 'we will')
    .replace(/they'll/g, 'they will')
    .replace(/i'd/g, 'i would')
    .replace(/he'd/g, 'he would')
    .replace(/she'd/g, 'she would')
    .replace(/we'd/g, 'we would')
    .replace(/they'd/g, 'they would');

  const isCorrect = (got === expected)
    || (expandContractions(got) === expandContractions(expected))
    || (got === expandContractions(expected))
    || (expandContractions(got) === expected);

  if (isCorrect) {
    state.answered = true;
    stopTimer();
    stopRecognition();
    state.score++;
    state.results.push({ correct: true });

    $('recognized-text').textContent = spoken;
    $('recognized-text').classList.add('correct');

    setTimeout(() => showResultScreen(true), 800);
  } else {
    // Show interim text but keep listening
    $('recognized-text').textContent = spoken;
    // Flash wrong briefly
    $('recognized-text').classList.add('wrong');
    setTimeout(() => $('recognized-text').classList.remove('wrong'), 600);
  }
}

// ============================================================
// Result Screen
// ============================================================
function showResultScreen(correct) {
  const q = state.questions[state.currentQ];
  showScreen(screenResult);

  $('result-icon').textContent = correct ? '⭕' : '❌';
  $('result-title').textContent = correct ? '正解！すごい！' : '残念...不正解';
  $('result-title').className = 'result-title ' + (correct ? 'correct-title' : 'wrong-title');
  $('result-en').textContent = q.en;
  $('result-jp').textContent = q.jp;
  $('result-grammar').textContent = q.grammar;

  // Next button label
  if (state.currentQ + 1 >= state.questions.length) {
    $('next-btn').textContent = '結果を見る 🏆';
  } else {
    $('next-btn').textContent = '次の問題へ →';
  }
}

function nextQuestion() {
  state.currentQ++;
  if (state.currentQ >= state.questions.length) {
    showFinalScore();
  } else {
    showScreen(screenGame);
    startQuestion();
  }
}

// ============================================================
// Final Score Screen
// ============================================================
function showFinalScore() {
  showScreen(screenScore);
  $('score-grade-label').textContent = QUESTIONS[state.grade].name + ' Lv.' + state.level + ' 結果';
  $('score-big').textContent = state.score + ' / ' + state.questions.length;

  let msg = '';
  const pct = state.score / state.questions.length;
  if (pct === 1) msg = '🎉 パーフェクト！素晴らしい！';
  else if (pct >= 0.8) msg = '👏 とても良くできました！';
  else if (pct >= 0.6) msg = '😊 まずまずの結果です！';
  else if (pct >= 0.4) msg = '💪 もう少し頑張ろう！';
  else msg = '📚 練習を続けましょう！';
  $('score-detail').textContent = msg;

  // Build final dots
  const wrap = $('final-dots');
  wrap.innerHTML = '';
  state.results.forEach(r => {
    const dot = document.createElement('span');
    dot.className = 'progress-dot ' + (r.correct ? 'done-correct' : 'done-wrong');
    wrap.appendChild(dot);
  });
}

// ============================================================
// Text-to-Speech
// ============================================================
function speakAnswer() {
  const q = state.questions[state.currentQ];
  if (!q) return;
  const synth = window.speechSynthesis;
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(q.en);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  synth.speak(utter);
}

// ============================================================
// Initialize
// ============================================================
showScreen(screenSelect);
</script>
